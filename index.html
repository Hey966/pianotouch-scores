<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PianoTouch 樂譜庫</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101727; color: #f3f6ff; }
    * { box-sizing: border-box; }
    body { max-width: 850px; margin: 0 auto; padding: 48px 20px; }
    h1 { margin-bottom: 8px; }
    h2 { margin-top: 34px; }
    p, small { color: #b9c7df; }
    ul { list-style: none; padding: 0; }
    li, .album { margin: 12px 0; padding: 18px; border-radius: 14px; background: #1c2941; }
    .album ul { margin-bottom: 0; }
    .album li { background: #263651; margin-bottom: 0; }
    .album h3 { margin: 0; }
    small { display: block; margin-top: 6px; }
    a { color: #96d9ff; }
    .empty { padding: 16px 0; }
  </style>
</head>
<body>
  <h1>PianoTouch 樂譜庫</h1>
  <p>已發布的樂譜會在 PianoTouch App 的線上樂譜庫顯示，使用者可直接在 App 內加入歌曲。</p>
  <p id="syncStatus" role="status"></p>
  <section aria-labelledby="singleHeading"><h2 id="singleHeading">單曲</h2><ul id="singles"><li>正在讀取歌曲清單…</li></ul></section>
  <section aria-labelledby="albumHeading"><h2 id="albumHeading">專輯</h2><div id="albums"></div></section>
  <p><a href="admin.html?v=20261025-album-remove">管理樂譜（新增／編輯／移除）</a></p>
  <script>
    function songItem(song) {
      const item = document.createElement('li');
      const title = document.createElement('strong'); title.textContent = song.title;
      const details = document.createElement('small');
      details.textContent = [song.artist, song.bpm + ' BPM', song.noteCount + ' 個音符'].filter(Boolean).join(' · ');
      item.append(title, details); return item;
    }
    function empty(text) {
      const item = document.createElement('p'); item.className = 'empty'; item.textContent = text; return item;
    }
    async function readLatestCatalog() {
      try {
        const url = 'https://api.github.com/repos/Hey966/pianotouch-scores/contents/catalog.json?ref=main&v=' + Date.now();
        const response = await fetch(url, {cache:'no-store', headers:{Accept:'application/vnd.github+json'}});
        if (!response.ok) throw new Error('GitHub 暫時無法讀取');
        const file = await response.json();
        if (file.encoding !== 'base64' || !file.content) throw new Error('樂譜清單無法解析');
        const binary = atob(file.content.replace(/\s/g, ''));
        const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        return {catalog:JSON.parse(new TextDecoder().decode(bytes)), fallback:false};
      } catch (_) {
        const response = await fetch('catalog.json?v=' + Date.now(), {cache:'no-store'});
        if (!response.ok) throw new Error('讀取失敗');
        return {catalog:await response.json(), fallback:true};
      }
    }
    let requestNumber = 0;
    async function loadScores() {
      const current = ++requestNumber;
      try {
        const {catalog, fallback} = await readLatestCatalog();
        if (current !== requestNumber) return;
        document.getElementById('syncStatus').textContent = fallback ? '即時清單暫時無法讀取，顯示的歌曲可能稍有延遲。' : '';
        if (catalog.version !== 1 || !Array.isArray(catalog.songs)) throw new Error('格式錯誤');
        const albums = Array.isArray(catalog.albums) ? catalog.albums : [];
        const albumIds = new Set(albums.map(a => a.id));
        const singles = catalog.songs.filter(song => !song.albumId || !albumIds.has(song.albumId));
        const singleList = document.getElementById('singles'); singleList.replaceChildren();
        if (singles.length) singles.forEach(song => singleList.append(songItem(song)));
        else singleList.append(empty('目前沒有單曲。'));
        const albumList = document.getElementById('albums'); albumList.replaceChildren();
        if (!albums.length) albumList.append(empty('目前沒有專輯。'));
        for (const album of albums) {
          const card = document.createElement('div'); card.className = 'album';
          const heading = document.createElement('h3'); heading.textContent = album.name;
          const artist = document.createElement('small'); artist.textContent = album.artist || '未標示演唱者／作者';
          const songs = document.createElement('ul');
          const tracks = catalog.songs.filter(song => song.albumId === album.id);
          if (tracks.length) tracks.forEach(song => songs.append(songItem(song)));
          else songs.append(empty('這個專輯目前沒有歌曲。'));
          card.append(heading, artist, songs); albumList.append(card);
        }
      } catch (_) {
        if (current !== requestNumber) return;
        document.getElementById('singles').textContent = '歌曲清單暫時無法讀取。';
        document.getElementById('albums').replaceChildren();
        document.getElementById('syncStatus').textContent = '';
      }
    }
    window.addEventListener('pageshow', loadScores);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadScores(); });
  </script>
</body>
</html>
